name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check --editable ".[dev]"

      - name: Run static analysis
        run: python -m ruff check .

      - name: Check launcher syntax
        run: |
          bash -n run.sh
          sh -n docker-entrypoint.sh
          shellcheck run.sh docker-entrypoint.sh

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Validate dependency graph
        run: python -m pip check

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
